name: TypeScript, milestone, and Chase checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: python3 -m pip install -r docs/requirements.txt

      - name: Check TypeScript
        run: npm exec -- tsc

      - name: Check milestone documentation
        run: npm run docs:milestones:check

      - name: Validate proposal and implementation phase
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 docs/milestones/workflow.py validate-pr \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --head-ref "${{ github.event.pull_request.head.ref }}" \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --event-path "$GITHUB_EVENT_PATH"

      - name: Run Chase regressions
        run: npm run play:chase:regress
